<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Сравнение документов</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page">


<h2>Что должно совпадать</h2>

<p class="subtitle">
Передвиньте ползунок
</p>



<div class="compare-area">



    <div class="document" id="invoiceBox">

        <img 
        src="images/invoice.png"
        class="document-image">

        <div id="invoiceMarkers"></div>

    </div>




    <div class="slider-container">

        <div 
        class="slider-track"
        id="sliderTrack">

            <div 
            class="slider-handle"
            id="sliderHandle">

                <div class="handle-circle">
                    ▼
                </div>

            </div>

        </div>

    </div>





    <div class="document" id="packingBox">

        <img 
        src="images/packing.png"
        class="document-image">

        <div id="packingMarkers"></div>

    </div>



</div>


</div>



<script src="data.js"></script>

<script src="script.js"></script>


</body>

</html>
